name: production-line-tracker

services:
  api:
    build:
      context: ./api
    image: production-line-tracker-api:local
    container_name: plt_api
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-production_tracker}
      DB_USER: ${POSTGRES_USER:-tracker_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tracker_pass}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - public_net
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped

  simulator:
    build:
      context: ./simulator
    image: production-line-simulator:local
    container_name: plt_simulator
    environment:
      API_URL: http://api:3000
      INTERVAL_SECONDS: 5
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public_net
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: plt_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-production_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "local"
      options:
        max-size: "1m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.00
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
